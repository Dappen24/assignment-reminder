<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Local only: no network access at all, so contact data can't leave this page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Assignment Reminders</title>
<style>
  :root { --bg: #f6f6f4; --card: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e2e2e0;
          --accent: #0a7cff; --bad: #c62828; --bad-bg: #fdecea; --ok: #2e7d32; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --card: #2c2c2e; --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c;
            --accent: #3d9bff; --bad: #ff6b6b; --bad-bg: #3a2222; --ok: #5ccf66; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  label.btn, button, a.send { display: inline-block; border: 1px solid var(--line); background: var(--card);
         color: var(--fg); border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; text-decoration: none; }
  a.send { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  input[type=file] { display: none; }
  select { font: inherit; padding: 5px; border-radius: 6px; }
  #drop { border: 2px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center; margin: 12px 0 20px; }
  #drop.over { border-color: var(--accent); }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .row.nophone { border-color: var(--bad); background: var(--bad-bg); }
  .row.sent { opacity: .55; }
  .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .role { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .name { font-weight: 600; }
  .flag { color: var(--bad); font-weight: 600; font-size: 13px; }
  .check { color: var(--ok); font-weight: 700; }
  .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  textarea { width: 100%; font: inherit; margin-top: 8px; padding: 8px; border: 1px solid var(--line);
             border-radius: 8px; background: var(--bg); color: var(--fg); resize: vertical; }
  details { margin-top: 28px; }
  details textarea { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  details h3 { font-size: 13px; margin: 14px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Assignment Reminders</h1>

  <div class="bar">
    <label class="btn">Import contacts CSV<input type="file" id="csv" accept=".csv,text/csv"></label>
    <span id="contactStatus" class="muted"></span>
  </div>

  <div id="drop">
    <label class="btn">Choose midweek PDF<input type="file" id="pdf" accept="application/pdf"></label>
    <div class="muted" style="margin-top:8px">or drop the Hourglass export here</div>
  </div>

  <div class="bar" id="weekBar" hidden>
    <select id="week"></select>
    <span id="summary" class="muted"></span>
    <button id="resetSent" type="button">Clear ✓ marks</button>
  </div>

  <div id="list"></div>

  <details>
    <summary>Message templates</summary>
    <p class="muted">Placeholders: {saludo} {fecha} {parte} {momento} {extra} {companero} {de_companero}</p>
    <div id="templates"></div>
    <p><button id="resetTemplates" type="button">Restore defaults</button>
       <button id="resetAliases" type="button">Forget name picks</button></p>
  </details>
</main>

<script src="vendor/pdf.worker.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
